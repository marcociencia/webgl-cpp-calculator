<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D Calculator powered by C++ & WebGL - Watch math come alive with real-time visualizations!">
    <meta name="keywords" content="calculator, webgl, c++, 3d, math, visualization, wasm, webassembly">
    <meta name="author" content="Marco Ciência">
    <meta property="og:title" content="WebGL C++ Calculator - 3D Math Visualization">
    <meta property="og:description" content="Experience calculations in stunning 3D! C++ powered, WebGL rendered.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    
    <title>🧮 WebGL C++ Calculator 3D</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 900px;
            width: 95%;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .canvas-container {
            flex: 1;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            min-height: 400px;
        }
        
        #glCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .calculator {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .display {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            color: #00ff88;
            font-size: 2em;
            font-family: 'Courier New', monospace;
            text-align: right;
            border: 1px solid rgba(0, 255, 136, 0.3);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        button {
            padding: 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .operator {
            background: rgba(102, 126, 234, 0.5);
            color: #00ff88;
        }
        
        .equals {
            background: rgba(0, 255, 136, 0.3);
            color: white;
            grid-column: span 2;
        }
        
        .function {
            background: rgba(118, 75, 162, 0.5);
            font-size: 1em;
        }
        
        .clear {
            background: rgba(255, 100, 100, 0.5);
            color: white;
        }
        
        .title {
            color: white;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="glCanvas"></canvas>
        </div>
        
        <div class="calculator">
            <div class="title">🧮 WebGL Calculator 3D</div>
            <div class="display" id="display">0</div>
            
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">AC</button>
                <button class="function" onclick="appendFunction('sin')">sin</button>
                <button class="function" onclick="appendFunction('cos')">cos</button>
                <button class="operator" onclick="appendOperator('/')">÷</button>
                
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="appendOperator('*')">×</button>
                
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="appendOperator('-')">−</button>
                
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="appendOperator('+')">+</button>
                
                <button class="function" onclick="appendFunction('sqrt')">√</button>
                <button onclick="appendNumber('0')">0</button>
                <button onclick="appendDot()">.</button>
                <button class="equals" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl2');
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Calculator logic
        let display = document.getElementById('display');
        let currentInput = '0';
        let equation = '';
        let shouldResetDisplay = false;
        
        function updateDisplay() {
            display.textContent = currentInput;
            triggerVisualization();
        }
        
        function appendNumber(number) {
            if (shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                currentInput = currentInput === '0' ? number : currentInput + number;
            }
            updateDisplay();
        }
        
        function appendOperator(op) {
            if (shouldResetDisplay) shouldResetDisplay = false;
            equation += currentInput + ' ' + op + ' ';
            currentInput = '0';
            updateDisplay();
        }
        
        function appendFunction(func) {
            if (shouldResetDisplay) shouldResetDisplay = false;
            equation += func + '(';
            updateDisplay();
        }
        
        function appendDot() {
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }
        
        function clearDisplay() {
            currentInput = '0';
            equation = '';
            shouldResetDisplay = false;
            updateDisplay();
        }
        
        function calculate() {
            try {
                equation += currentInput;
                let result = eval(equation.replace('×', '*').replace('÷', '/'));
                currentInput = result.toString();
                equation = '';
                shouldResetDisplay = true;
                // Trigger special 3D effect for result
                triggerResultEffect();
            } catch (error) {
                currentInput = 'Error';
                equation = '';
                shouldResetDisplay = true;
            }
            updateDisplay();
        }
        
        // WebGL Visualization
        function triggerVisualization() {
            if (!gl) return;
            
            // Simple WebGL animation based on input
            gl.clearColor(
                Math.sin(Date.now() * 0.001) * 0.5 + 0.5,
                Math.cos(Date.now() * 0.001) * 0.5 + 0.5,
                0.5,
                0.1
            );
            gl.clear(gl.COLOR_BUFFER_BIT);
        }
        
        function triggerResultEffect() {
            // Special visualization for results
            if (!gl) return;
            gl.clearColor(0, 1, 0.5, 0.2);
            gl.clear(gl.COLOR_BUFFER_BIT);
            setTimeout(() => {
                gl.clearColor(0, 0, 0, 0);
                gl.clear(gl.COLOR_BUFFER_BIT);
            }, 500);
        }
        
        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '+') appendOperator('+');
            else if (e.key === '-') appendOperator('-');
            else if (e.key === '*') appendOperator('*');
            else if (e.key === '/') appendOperator('/');
            else if (e.key === '.') appendDot();
            else if (e.key === 'Enter') calculate();
            else if (e.key === 'Escape') clearDisplay();
            else if (e.key === 'Backspace') {
                currentInput = currentInput.slice(0, -1) || '0';
                updateDisplay();
            }
        });
        
        // Initialize WebGL
        if (gl) {
            gl.clearColor(0.0, 0.0, 0.0, 0.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
        }
    </script>
</body>
</html>
